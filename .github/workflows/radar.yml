name: Radar semanal

on:
  schedule:
    - cron: "17 11 * * 1"   # lunes 11:17 UTC = 08:17 en Argentina (GitHub puede demorarlo unos minutos)
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano
    inputs:
      dry:
        description: "Solo descargar y filtrar, sin Claude ni mail (--dry)"
        type: boolean
        default: false
      max_posts:
        description: "Tope de posts a clasificar"
        default: "200"
      buscar_apps:
        description: "Solo buscar ids de la App Store (nombres separados por coma) y salir"
        default: ""

permissions:
  contents: read
  actions: read      # para bajar la base de la corrida anterior

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  buscar-apps:
    if: ${{ inputs.buscar_apps != '' && inputs.buscar_apps != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Buscar apps
        env:
          APPS: ${{ inputs.buscar_apps }}
        run: |
          IFS=',' read -ra names <<< "$APPS"
          for n in "${names[@]}"; do
            n="$(echo "$n" | xargs)"
            echo "### $n"
            python radar.py --find-app "$n" || true
            sleep 2
          done

  radar:
    if: ${{ inputs.buscar_apps == '' || inputs.buscar_apps == null }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      # La base (radar.db) y los reportes viven en un artifact que pasa de una corrida a la
      # siguiente. No se commitean: así los datos de YouTube se borran a los 30 días de verdad.
      - name: Bajar la base guardada más reciente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p datos
          # El artifact "radar-datos" más nuevo que no venció (las corridas de buscar_apps no guardan base).
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=radar-datos&per_page=20" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -n "$run_id" ]; then
            # Si existe y no se puede bajar, mejor fallar que seguir con la base vacía y pisar la buena.
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n radar-datos -D datos
          else
            echo "No hay base guardada: se empieza de cero."
          fi
          ls -la datos

      - name: Correr el radar
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_EMAIL_TO: ${{ vars.RADAR_EMAIL_TO }}
          RADAR_EMAIL_FROM: ${{ vars.RADAR_EMAIL_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAX_POSTS: ${{ inputs.max_posts || '200' }}
          DRY: ${{ inputs.dry && '--dry' || '' }}
        run: python radar.py --db datos/radar.db --out datos/reporte.md --max-posts "$MAX_POSTS" $DRY

      # También en --dry: la corrida queda como "la última exitosa" y la siguiente toma su base.
      - name: Guardar la base y los reportes para la próxima corrida
        uses: actions/upload-artifact@v4
        with:
          name: radar-datos
          path: datos/
          retention-days: 90
          include-hidden-files: false
