# Configuración del radar de dolores.

model: claude-haiku-5-5   # modelo de Claude para clasificar
batch_size: 15            # textos por llamada a Claude
max_posts: 200            # tope de posts nuevos a clasificar por corrida (lo pisa --max-posts)
max_retries: 2            # reintentos si Claude devuelve un JSON inválido o incompleto
min_potential: 2          # monetizable mínimo para entrar al reporte
dashboard_weeks: 8        # semanas que muestra dashboard.html

sources:
  reddit:
    enabled: false          # apagado hasta tener REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET
    subreddits: [argentina, merval, emprendedores, buenosaires, RepublicaArgentina]
    queries:
      - alguien sabe como
      - no encuentro
      - me cansé
      - es un desastre
      - recomiendan
      - cuánto cobran
      - cómo hago para
      - pierdo tiempo
    sort: new
    time_filter: month    # hour | day | week | month | year | all
    limit_per_query: 25
    sleep_seconds: 2      # pausa entre búsquedas (PRAW además respeta el rate limit de la API)

  youtube:
    enabled: false            # apagado hasta tener YOUTUBE_API_KEY
    queries:                  # cada búsqueda gasta 100 unidades de cuota (10.000 gratis por día)
      - cómo hacer el trámite
      - monotributo
      - alquilar departamento
      - sacar turno
      - emprender en argentina
      - cuánto cobrar
    region: AR
    language: es
    video_days: 30            # solo videos publicados en los últimos N días
    videos_per_query: 5
    comments_per_video: 50    # 1 unidad de cuota por video
    sleep_seconds: 1
    retention_days: 30        # las políticas de la API de YouTube limitan cuánto se guardan sus datos

  news:                       # Google News por RSS, sin clave
    enabled: true
    queries:
      - reclamos vecinos
      - falta de turnos
      - quejas usuarios
      - demoras trámite
      - aumento de precios servicio
    days: 7
    sleep_seconds: 2

  appstore:                   # reseñas de la App Store (RSS público de Apple), sin clave
    enabled: true
    country: ar
    max_rating: 2             # solo reseñas de 1 y 2 estrellas
    pages: 2                  # hasta 50 reseñas por página, máx. 10
    filter: false             # una reseña de 1-2 estrellas ya es una queja: no pasa por pain_words
    sleep_seconds: 2
    # Para sumar apps: Actions → Run workflow → buscar_apps (o python radar.py --find-app "nombre")
    apps:
      # billeteras y bancos
      - {name: Mercado Pago, id: 925436649}
      - {name: Cuenta DNI, id: 1436655618}
      - {name: MODO, id: 1530606263}
      - {name: Ualá, id: 1279808159}
      - {name: Brubank, id: 1295202448}
      - {name: Naranja X, id: 1452691757}
      - {name: BNA+, id: 1523383806}
      - {name: Nueva BNA+, id: 6446181557}
      - {name: Galicia, id: 774860115}
      - {name: Santander, id: 626971464}
      # Estado y trámites
      - {name: Mi Argentina, id: 1107620792}
      - {name: mi ANSES, id: 1587022312}
      - {name: ARCA Móvil, id: 1237748064}
      # compras, delivery, servicios
      - {name: Mercado Libre, id: 463624852}
      - {name: PedidosYa, id: 490099807}
      - {name: Rappi, id: 984044296}
      - {name: Mi Personal, id: 373559386}
      - {name: Cuándo SUBO, id: 1447379498}

# Fragmentos de expresión regular (sin distinguir mayúsculas). Un post pasa el filtro
# si su texto contiene alguno. Cada fuente puede saltear el filtro con filter: false.
pain_words:
  - no encuentro
  - alguien sab
  - c[oó]mo hago
  - me cans
  - desastre
  - recomiend
  - cobran
  - pierdo tiempo
  - imposible
  - odio
  - no hay forma
  - pago por
  - me cobra
  - manual
  - planilla
  - excel
  - turno
  - reclam
  - quej
  - falta de
  - faltan
  - no funciona
  - no anda
